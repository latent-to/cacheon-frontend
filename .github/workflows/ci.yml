name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pin canonical Cacheon documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "CACHEON_DOCS_REF=$(gh api repos/latent-to/cacheon/commits/main --jq .sha)" >> "$GITHUB_ENV"

      - name: Documentation adapter tests
        run: npm run test:docs

      - name: Prettier (check only)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
